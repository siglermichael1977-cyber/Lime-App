<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #faf9f5;
    }
    .search-container {
      width: 390px;
      height: 844px;
      background: #faf9f5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0080FF 0%, #00FF41 100%);
      padding: 16px;
      color: white;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 128, 255, 0.3);
    }
    .header-title {
      font-size: 20px;
      font-weight: 600;
    }
    .search-section {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e8e6dc;
    }
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e8e6dc;
      border-radius: 20px;
      font-size: 14px;
      background: #f5f5f5;
      color: #0f0c08;
      outline: none;
    }
    .search-input::placeholder {
      color: #999;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 12px;
      margin-top: 16px;
    }
    .hashtag-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .hashtag-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .hashtag-item:hover {
      background: #f5f5f5;
    }
    .hashtag-name {
      font-size: 16px;
      font-weight: 600;
      color: #00FF41;
      margin-bottom: 4px;
    }
    .hashtag-count {
      font-size: 12px;
      color: #999;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: background 0.2s;
    }
    .result-item:hover {
      background: #f5f5f5;
    }
    .result-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF0080, #00FF41);
      flex-shrink: 0;
    }
    .result-info {
      flex: 1;
    }
    .result-name {
      font-size: 14px;
      font-weight: 600;
      color: #0f0c08;
    }
    .result-handle {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .nav-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid #e8e6dc;
      background: white;
      font-size: 24px;
    }
    .nav-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #666;
      border-radius: 8px;
    }
    .nav-icon.active {
      color: #00FF41;
      background: rgba(0, 255, 65, 0.15);
    }
  </style>
</helmet>
<div class="search-container">
  <div class="header">
    <div class="header-title">Zoeken</div>
  </div>

  <div class="search-section">
    <input type="text" class="search-input" placeholder="Zoek berichten, mensen, tags...">
  </div>

  <div class="content">
    <div class="section-title">Trending Hashtags</div>
    <div class="hashtag-grid">
      <div class="hashtag-item">
        <div class="hashtag-name">#CaribeanVibes</div>
        <div class="hashtag-count">2.4K berichten</div>
      </div>
      <div class="hashtag-item">
        <div class="hashtag-name">#IslandLife</div>
        <div class="hashtag-count">5.8K berichten</div>
      </div>
      <div class="hashtag-item">
        <div class="hashtag-name">#LimeMusic</div>
        <div class="hashtag-count">1.2K berichten</div>
      </div>
      <div class="hashtag-item">
        <div class="hashtag-name">#Community</div>
        <div class="hashtag-count">3.1K berichten</div>
      </div>
    </div>

    <div class="section-title">Populaire Gebruikers</div>
    <div class="result-item">
      <div class="result-avatar"></div>
      <div class="result-info">
        <div class="result-name">Island Explorer</div>
        <div class="result-handle">@islandexplorer</div>
      </div>
    </div>
    <div class="result-item">
      <div class="result-avatar"></div>
      <div class="result-info">
        <div class="result-name">Caribbean Beats</div>
        <div class="result-handle">@caribbeanbeets</div>
      </div>
    </div>
    <div class="result-item">
      <div class="result-avatar"></div>
      <div class="result-info">
        <div class="result-name">Local Vibes</div>
        <div class="result-handle">@localvibes_</div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-icon">🏠</div>
    <div class="nav-icon active">🔍</div>
    <div class="nav-icon">✏️</div>
    <div class="nav-icon">💬</div>
    <div class="nav-icon">👤</div>
  </div>
</div>
</x-dc>
</body>
</html>
