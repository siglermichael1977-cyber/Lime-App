<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #faf9f5;
    }
    .notifications-container {
      width: 390px;
      height: 844px;
      background: #faf9f5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0080FF 0%, #00FF41 100%);
      padding: 12px 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 128, 255, 0.3);
    }
    .header-title {
      font-size: 20px;
      font-weight: 600;
    }
    .language-selector {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .notifications-list {
      flex: 1;
      overflow-y: auto;
    }
    .notification-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #f0eee6;
      cursor: pointer;
      transition: background 0.2s;
    }
    .notification-item:hover {
      background: #faf9f5;
    }
    .notification-item.unread {
      background: rgba(0, 255, 65, 0.08);
    }
    .notification-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF0080, #00FF41);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .notification-content {
      flex: 1;
    }
    .notification-text {
      font-size: 14px;
      color: #0f0c08;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .notification-text .name {
      font-weight: 600;
    }
    .notification-text .action {
      color: #666;
    }
    .notification-time {
      font-size: 12px;
      color: #999;
    }
    .notification-icon {
      font-size: 24px;
      color: #00FF41;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .nav-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid #e8e6dc;
      background: white;
      font-size: 24px;
    }
    .nav-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #666;
      border-radius: 8px;
    }
    .nav-icon.active {
      color: #00FF41;
      background: rgba(0, 255, 65, 0.15);
    }
  </style>
</helmet>
<div class="notifications-container">
  <div class="header">
    <div class="header-title">Notifications</div>
    <select class="language-selector">
      <option selected>🇺🇸 EN</option>
      <option>🇩🇴 ES</option>
      <option>🇭🇹 FR</option>
      <option>🇭🇹 HT</option>
      <option>🇦🇼 NL</option>
    </select>
  </div>

  <div class="notifications-list">
    <div class="notification-item unread">
      <div class="notification-avatar"></div>
      <div class="notification-content">
        <div class="notification-text"><span class="name">Alex Rivera</span> <span class="action">liked your post</span></div>
        <div class="notification-time">Just now</div>
      </div>
      <div class="notification-icon">❤️</div>
    </div>

    <div class="notification-item unread">
      <div class="notification-avatar"></div>
      <div class="notification-content">
        <div class="notification-text"><span class="name">Caribbean Crew</span> <span class="action">commented on your post</span></div>
        <div class="notification-time">5m ago</div>
      </div>
      <div class="notification-icon">💬</div>
    </div>

    <div class="notification-item">
      <div class="notification-avatar"></div>
      <div class="notification-content">
        <div class="notification-text"><span class="name">Jazz Events</span> <span class="action">followed you</span></div>
        <div class="notification-time">12m ago</div>
      </div>
      <div class="notification-icon">👤</div>
    </div>

    <div class="notification-item">
      <div class="notification-avatar"></div>
      <div class="notification-content">
        <div class="notification-text"><span class="name">Miguel Santos</span> <span class="action">liked your post</span></div>
        <div class="notification-time">1h ago</div>
      </div>
      <div class="notification-icon">❤️</div>
    </div>

    <div class="notification-item">
      <div class="notification-avatar"></div>
      <div class="notification-content">
        <div class="notification-text"><span class="name">Island Adventures</span> <span class="action">started following you</span></div>
        <div class="notification-time">3h ago</div>
      </div>
      <div class="notification-icon">👤</div>
    </div>

    <div class="notification-item">
      <div class="notification-avatar"></div>
      <div class="notification-content">
        <div class="notification-text"><span class="name">Festival Team</span> <span class="action">mentioned you in a comment</span></div>
        <div class="notification-time">Yesterday</div>
      </div>
      <div class="notification-icon">🎉</div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-icon">🏠</div>
    <div class="nav-icon">🔍</div>
    <div class="nav-icon">✏️</div>
    <div class="nav-icon">💬</div>
    <div class="nav-icon">👤</div>
  </div>
</div>
</x-dc>
</body>
</html>
