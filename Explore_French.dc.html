<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #faf9f5;
    }
    .explore-container {
      width: 390px;
      height: 844px;
      background: #faf9f5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0080FF 0%, #00FF41 100%);
      padding: 16px;
      color: white;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 128, 255, 0.3);
    }
    .header-title {
      font-size: 20px;
      font-weight: 600;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .featured-section {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f0c08;
      margin-bottom: 12px;
    }
    .featured-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .featured-card:hover {
      transform: translateY(-2px);
    }
    .featured-image {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, rgba(0, 128, 255, 0.2), rgba(0, 255, 65, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .featured-info {
      padding: 12px;
    }
    .featured-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f0c08;
      margin-bottom: 4px;
    }
    .featured-meta {
      font-size: 12px;
      color: #999;
    }
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .category-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .category-item:hover {
      background: #f5f5f5;
    }
    .category-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .category-name {
      font-size: 13px;
      font-weight: 600;
      color: #0f0c08;
    }
    .nav-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid #e8e6dc;
      background: white;
      font-size: 24px;
    }
    .nav-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #666;
      border-radius: 8px;
    }
    .nav-icon.active {
      color: #00FF41;
      background: rgba(0, 255, 65, 0.15);
    }
  </style>
</helmet>
<div class="explore-container">
  <div class="header">
    <div class="header-title">Explorer</div>
  </div>

  <div class="content">
    <div class="featured-section">
      <div class="section-title">En vedette</div>
      <div class="featured-card">
        <div class="featured-image">🎉</div>
        <div class="featured-info">
          <div class="featured-title">Festival des Îles 2026</div>
          <div class="featured-meta">12.4K intéressés • Tendance</div>
        </div>
      </div>
      <div class="featured-card">
        <div class="featured-image">🎭</div>
        <div class="featured-info">
          <div class="featured-title">Semaine de la Culture Caribéenne</div>
          <div class="featured-meta">8.2K intéressés • Cette semaine</div>
        </div>
      </div>
    </div>

    <div class="featured-section">
      <div class="section-title">Catégories</div>
      <div class="category-grid">
        <div class="category-item">
          <div class="category-icon">🎵</div>
          <div class="category-name">Musique</div>
        </div>
        <div class="category-item">
          <div class="category-icon">🏝️</div>
          <div class="category-name">Voyage</div>
        </div>
        <div class="category-item">
          <div class="category-icon">🎨</div>
          <div class="category-name">Art</div>
        </div>
        <div class="category-item">
          <div class="category-icon">🍔</div>
          <div class="category-name">Nourriture</div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-icon">🏠</div>
    <div class="nav-icon">🔍</div>
    <div class="nav-icon">✏️</div>
    <div class="nav-icon">💬</div>
    <div class="nav-icon">👤</div>
  </div>
</div>
</x-dc>
</body>
</html>
